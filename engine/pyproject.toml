[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thermpro-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "thermpro-units",
]

[tool.hatch.build.targets.wheel]
packages = ["thermal_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
