[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thermpro-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    # The artifact upload endpoint takes multipart form data, which
    # FastAPI refuses to route without this at import time.
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "jsonschema>=4.23.0",
    "boto3>=1.35.0",
    "structlog>=24.4.0",
    "thermpro-units",
    "thermpro-schemas",
    "thermpro-engine",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "boto3-stubs[s3]>=1.35.0",
    "testcontainers>=4.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/thermpro_api"]

# Ruff configuration lives in the repository-root ruff.toml so that every
# package is linted with an identical rule set (see that file for rationale).

# mypy configuration lives in the repository-root mypy.ini (see that file).

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "units: unit conversion tests (UT-UNITS-001 through UT-UNITS-010)",
    "integration: requires running PostgreSQL and MinIO",
    "contract: schema contract tests",
]
