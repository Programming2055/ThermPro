; Repository-wide mypy configuration.
;
; mypy only reads the config file in the current working directory, so the
; per-package [tool.mypy] sections were silently ignored whenever CI invoked
; mypy from the repository root. This file is the single source of truth; see
; ruff.toml for the same reasoning on the lint side.

[mypy]
strict = True
python_version = 3.12
plugins = pydantic.mypy
mypy_path = packages/units/src:packages/schemas/src:engine:apps/api/src

; jsonschema and alembic ship no py.typed marker.
[mypy-jsonschema.*]
ignore_missing_imports = True

[mypy-alembic.*]
ignore_missing_imports = True
