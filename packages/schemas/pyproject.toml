[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thermpro-schemas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/thermpro_schemas"]

[tool.mypy]
strict = true
ignore_missing_imports = true
